name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: PHP syntax
        run: find src tests public bin templates -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: vendor/bin/phpunit
      - name: Accessibility and content checks
        run: php bin/a11y-check.php
